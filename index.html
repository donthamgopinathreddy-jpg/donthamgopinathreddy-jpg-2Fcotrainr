<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#ff9500" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="CoTrainr" />
    <meta
      name="description"
      content="Your personal fitness companion. Connect with verified trainers, track your nutrition, and join a fitness community."
    />
    <link rel="manifest" href="/manifest.json" />
    <link
      rel="icon"
      type="image/x-icon"
      href="https://cdn.builder.io/api/v1/image/assets%2Fc659d255956c4643b6576a691786eec0%2Fe823f4816a094df5bccc1efcb008e8ff?format=webp&width=192"
    />
    <title>CoTrainr - Find Your Trainer</title>
  </head>

  <body>
    <div id="root">
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          background: #f5f5f5;
          font-family: system-ui;
        "
      >
        <div style="text-align: center">
          <p style="color: #666">Loading app...</p>
        </div>
      </div>
    </div>

    <script type="module" src="/client/main.tsx"></script>
    <!-- Capacitor initialization script - loads only on mobile -->
    <script>
      // Only load Capacitor bridge on mobile/app environment
      if (
        typeof window !== "undefined" &&
        window.location.protocol === "capacitor://"
      ) {
        const script = document.createElement("script");
        script.src = "capacitor://bridge";
        document.body.appendChild(script);
      }

      // Debug logging
      console.log("HTML loaded, waiting for React app...");

      // If app doesn't load after 10 seconds, show error
      setTimeout(() => {
        const root = document.getElementById("root");
        if (
          root &&
          root.children.length === 1 &&
          root.children[0].style.display === "flex"
        ) {
          console.error("App failed to load within 10 seconds");
          root.innerHTML =
            '<div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f5f5f5; font-family: system-ui;"><div style="text-align: center; color: #d32f2f;"><p>Failed to load app</p><p style="font-size: 12px; color: #999;">Check browser console for errors</p></div></div>';
        }
      }, 10000);
    </script>
  </body>
</html>
